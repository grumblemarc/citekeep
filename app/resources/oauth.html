<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citekeep sign-in</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F4F5F1;color:#1C2228;margin:0;padding:48px 16px}main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #D8DCD3;border-radius:8px;padding:28px}h1{font-size:22px;margin:0 0 8px}code{display:block;word-break:break-all;background:#ECEEE8;padding:12px;border-radius:6px;margin:14px 0;font-size:13px}button{background:#2C6A4E;color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:15px;cursor:pointer}p{line-height:1.5}</style></head>
<body><main id="m"></main><script>
const q=new URLSearchParams(location.search), m=document.getElementById("m");
if(q.get("code")){
  const v="CK1:"+(q.get("state")||"")+":"+q.get("code");
  m.innerHTML='<h1>Almost done</h1><p>Copy this code, go back to Citekeep, and paste it into the box under Sign in to Google Drive.</p><code id="c"></code><button id="b">Copy code</button><p id="s"></p>';
  document.getElementById("c").textContent=v;
  document.getElementById("b").onclick=async()=>{try{await navigator.clipboard.writeText(v);document.getElementById("s").textContent="Copied. You can close this tab.";}catch{const r=document.createRange();r.selectNodeContents(document.getElementById("c"));getSelection().removeAllRanges();getSelection().addRange(r);document.getElementById("s").textContent="Press Ctrl+C to copy.";}};
} else {
  m.innerHTML='<h1>Sign-in didn\'t finish</h1><p>'+(q.get("error")==="access_denied"?"You cancelled the sign-in.":"Google didn't send a code.")+' Go back to Citekeep and click Sign in to Google Drive again.</p>';
}
</script></body></html>
